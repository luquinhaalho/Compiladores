server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # O navegador fala só com este contêiner. O Nginx encaminha /api
    # ao serviço "backend" na rede do Compose, provando a comunicação
    # entre os dois contêineres.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
