<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compiladores — AST</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <p class="eyebrow">Laboratório de compiladores</p>
        <h1>Árvores de sintaxe abstrata</h1>
        <p class="lede">
          Subconjunto didático de Java: declaração de variáveis e expressões
          aritméticas.
        </p>
      </header>

      <section class="panel" aria-labelledby="hello-heading">
        <div class="panel-head">
          <h2 id="hello-heading">Mensagem integrada</h2>
          <p>Resposta de <code>GET /api/hello</code> no backend.</p>
        </div>
        <p id="message" class="message" role="status" aria-live="polite">
          Aguardando o backend…
        </p>
        <p id="detail" class="detail"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
